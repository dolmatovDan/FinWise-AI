services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-finwise}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finwise-network

  # Run database migrations for auth
  migrate-auth:
    image: migrate/migrate:latest
    container_name: finwise-migrate-auth
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/auth/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-finwise}?sslmode=disable",
      "up"
    ]
    networks:
      - finwise-network

  # Run database migrations for transactions
  migrate-transactions:
    image: migrate/migrate:latest
    container_name: finwise-migrate-transactions
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    volumes:
      - ./backend/transactions/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-finwise}?sslmode=disable",
      "up"
    ]
    networks:
      - finwise-network

  # Auth Service
  auth:
    build:
      context: ./backend
      dockerfile: auth/Dockerfile
    container_name: finwise-auth
    restart: unless-stopped
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    environment:
      # Server config
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: 8082
      # Database config
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-finwise}
      DB_SSLMODE: disable
      # JWT config
      JWT_PRIVATE_KEY_PATH: ./keys/private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/public.pem
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      # Logger config
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8082:8082"
    networks:
      - finwise-network

  # Transactions & DB API Service
  transactions:
    build:
      context: ./backend
      dockerfile: transactions/Dockerfile
    container_name: finwise-transactions
    restart: unless-stopped
    depends_on:
      migrate-transactions:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      # Server config
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Database config
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-finwise}
      DB_SSLMODE: disable
      # JWT config
      JWT_PUBLIC_KEY_PATH: ./keys/public.pem
      # Logger config
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - finwise-network
  
  # ML API Service
  ml-api:
    build:
      context: ./backend
      dockerfile: ml-api/Dockerfile
    container_name: finwise-ml-api
    restart: unless-stopped
    depends_on:
      migrate-transactions:
        condition: service_completed_successfully
    environment:
      # Server config
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: 8081
      # Logger config
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # ML launcher config
      ML_LAUNCHER: http
      ML_BASE_URL: https://minstradamus-finwise-ml.hf.space
    ports:
      - "8081:8081"
    networks:
      - finwise-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: finwise-prometheus
    restart: unless-stopped
    depends_on:
      - auth
      - transactions
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - finwise-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  finwise-network:
    driver: bridge
