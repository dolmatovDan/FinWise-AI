# IMPORTANT: Before deploying, you must populate this secret with actual JWT keys
#
# To create the secret from your existing keys:
# kubectl create secret generic jwt-keys \
#   --from-file=private.pem=backend/auth/keys/private.pem \
#   --from-file=public.pem=backend/auth/keys/public.pem \
#   -n finwise
#
# Or use this template and base64-encode your keys:
# cat backend/auth/keys/private.pem | base64
# cat backend/auth/keys/public.pem | base64

apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: finwise
type: Opaque
data:
  private.pem: ""  # Add base64-encoded private key here
  public.pem: ""   # Add base64-encoded public key here
