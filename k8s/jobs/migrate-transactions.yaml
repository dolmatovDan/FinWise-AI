apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-transactions
  namespace: finwise
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done
        env:
        - name: PGHOST
          value: postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_USER
      - name: wait-for-auth-migration
        image: postgres:16-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for auth migration to complete..."
          echo "Checking if user table exists..."
          max_attempts=60
          attempt=0
          until psql -h postgres -U $PGUSER -d $PGDATABASE -c '\dt user' | grep -q user || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: User table not found, waiting..."
            sleep 5
            attempt=$((attempt + 1))
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Auth migration did not complete in time"
            exit 1
          fi
          echo "Auth migration completed successfully"
        env:
        - name: PGHOST
          value: postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_PASSWORD
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: finwise-config
              key: DB_NAME
      containers:
      - name: migrate
        image: finwise-transactions-migrate:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-path"
        - "/migrations"
        - "-database"
        - "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)?sslmode=disable"
        - "up"
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: finwise-config
              key: DB_NAME
